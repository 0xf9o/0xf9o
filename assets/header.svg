<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
<!-- Grid Pattern -->
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="8" />
  <rect width="100%" height="100%" fill="url(#grid)" rx="8" />
  
  <!-- Outer glowing border lines -->
  <path d="M 10 10 L 790 10 L 790 240 L 10 240 Z" fill="none" stroke="#00ff66" stroke-opacity="0.15" stroke-width="2" rx="8" />
  
  <!-- Cyber Corner accents -->
  <path d="M 10 35 L 10 10 L 35 10" fill="none" stroke="#00ff66" stroke-width="3" />
  <path d="M 790 35 L 790 10 L 765 10" fill="none" stroke="#00ff66" stroke-width="3" />
  <path d="M 10 215 L 10 240 L 35 240" fill="none" stroke="#00ff66" stroke-width="3" />
  <path d="M 790 215 L 790 240 L 765 240" fill="none" stroke="#00ff66" stroke-width="3" />

  <!-- Abstract Tech Line Graphics -->
  <path d="M 30 190 H 200 L 220 210 H 770" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3" />
  <circle cx="30" cy="190" r="3" fill="#00e5ff" />
  <circle cx="770" cy="210" r="3" fill="#00e5ff" />
  
  <!-- Main Title -->
  <text x="50%" y="110" font-family="monospace, Courier New" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="10">0XF9O</text>
  
  <!-- Subtitle -->
  <text x="50%" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#00e5ff" text-anchor="middle" letter-spacing="3">OFFENSIVE SECURITY &amp; DEVSECOPS</text>
</svg>
